# ==============================================================================
# VARELLION Accessories Backend Test Configuration (application-test.properties)
# ==============================================================================

# H2 In-Memory Database for Offline Repository Tests
spring.datasource.url=jdbc:h2:mem:varellion_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate Test Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway during tests
spring.flyway.enabled=false

# Test Security & JWT Properties
jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-expiration=604800000
FRONTEND_URL=http://localhost:3000
google.oauth.client-id=test-google-client-id.apps.googleusercontent.com
varellion.security.cors.allowed-origins=http://localhost:3000
varellion.security.jwt.secret=varellion-test-secret-key-must-be-at-least-256-bits-long-for-testing-purposes
varellion.security.jwt.issuer=https://test.supabase.co/auth/v1
varellion.security.admin-emails=admin@varellion.com

# Test Store Settings
varellion.store.currency=EGP
varellion.store.reservation-hours=24
varellion.store.low-stock-threshold=5
