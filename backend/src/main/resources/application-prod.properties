# ==============================================================================
# VARELLION Backend Production Profile Configuration (application-prod.properties)
# Activated via SPRING_PROFILES_ACTIVE=prod
# ==============================================================================

# Server Lifecycle & Graceful Shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# JPA / Hibernate Hardening
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Production Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# HikariCP Connection Pool (Optimized for VPS + Supabase Connection Pooler)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.pool-name=VarellionProdPool

# Strict Production Error Sanitization (No stack traces or internal messages leaked)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Spring Boot Actuator Production Exposure
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# Production Logging Levels (Sanitized, no sensitive dumps)
logging.level.root=INFO
logging.level.com.varellion.store=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
