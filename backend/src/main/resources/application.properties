# ==============================================================================
# VARELLION Accessories Backend Configuration (application.properties)
# ==============================================================================

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# Application Name
spring.application.name=varellion-backend

# Supabase PostgreSQL Datasource Configuration
# SECURITY: No defaults — values MUST come from .env or environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=VarellionHikariPool

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false


# ===================================================================
# JWT & Security Configuration
# ===================================================================
# SECURITY: No default — a strong random Base64-encoded secret (≥256 bits) MUST be set in .env
jwt.secret=${JWT_SECRET}

# Access Token Expiration: 15 minutes (900000 ms)
jwt.expiration=${JWT_EXPIRATION:900000}

# Refresh Token Expiration: 7 days (604800000 ms)
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Allowed Frontend URLs for CORS (comma-separated)
FRONTEND_URL=${FRONTEND_URL:http://localhost:3000,http://127.0.0.1:3000}

# Google OAuth Client ID (MUST be set in .env)
google.oauth.client-id=${GOOGLE_CLIENT_ID}

# VARELLION Store Business Rules
varellion.store.currency=${STORE_CURRENCY:EGP}
varellion.store.reservation-hours=${ORDER_RESERVATION_HOURS:24}
varellion.store.low-stock-threshold=${LOW_STOCK_THRESHOLD:5}

# Server Error Sanitization
server.error.include-stacktrace=never
server.error.include-message=never

# Actuator Security (do not leak system details)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
